name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run check
      - name: Boot and smoke test
        run: |
          npm start > /tmp/kitchenkeep.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q "KitchenKeep"
